name: Bug report
description: Report a problem with finding papers, saving PDFs or formatting references.
title: "[Bug] "
body:
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 142
  - type: input
    id: paper
    attributes:
      label: Paper DOI, ID or link
      description: If the problem concerns a specific paper, include its identifier.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
